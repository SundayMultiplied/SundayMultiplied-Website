name: Deploy church onboarding agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/church-onboarding-agent/**"
      - ".github/workflows/deploy-onboarding-agent.yml"

permissions:
  contents: read

concurrency:
  group: church-onboarding-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/church-onboarding-agent/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix tools/church-onboarding-agent

      - name: Generate Cloudflare types
        run: npm --prefix tools/church-onboarding-agent run types

      - name: Validate
        run: npm --prefix tools/church-onboarding-agent run check

      - name: Build
        run: npm --prefix tools/church-onboarding-agent run build

      - name: Ensure private church asset bucket exists
        working-directory: tools/church-onboarding-agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket info sunday-multiplied-church-assets >/dev/null 2>&1; then
            npx wrangler r2 bucket create sunday-multiplied-church-assets
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/church-onboarding-agent
          command: deploy

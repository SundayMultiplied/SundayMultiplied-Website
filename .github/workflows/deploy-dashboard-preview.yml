name: Deploy church dashboard preview

on:
  push:
    branches:
      - feature/church-dashboard-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: church-dashboard-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate church registry
        run: node scripts/generate-production-registry.mjs

      - name: Build preview artifact
        run: bash scripts/sites-env.sh -- npx vinext build

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/sites-env.sh -- npx wrangler deploy --name sunday-multiplied-preview

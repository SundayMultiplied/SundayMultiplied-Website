name: Audit Cloudflare production resources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-cloudflare-production.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY != '' }}
      HAS_APPROVAL_ADMIN_EMAIL: ${{ secrets.APPROVAL_ADMIN_EMAIL != '' }}
      HAS_APPROVAL_NOTIFICATION_EMAIL: ${{ secrets.APPROVAL_NOTIFICATION_EMAIL != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit configured Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-audit

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services" \
            > cloudflare-audit/workers-response.json

          d1_access=false
          if npx --yes wrangler@4.92.0 d1 info 10522aad-f31e-4fb2-a848-a2563f015171 --json \
            > cloudflare-audit/d1.json 2> cloudflare-audit/d1-error.txt; then
            d1_access=true
          fi

          r2_access=false
          if npx --yes wrangler@4.92.0 r2 bucket list --json \
            > cloudflare-audit/r2.json 2> cloudflare-audit/r2-error.txt; then
            r2_access=true
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            > cloudflare-audit/domains-response.json || printf '{"success":false,"result":[]}' > cloudflare-audit/domains-response.json

          mkdir -p cloudflare-audit/worker-details
          for worker_name in sunday-multiplied-website sunday-multiplied-preview sunday-multiplied-onboarding; do
            for endpoint in settings secrets deployments; do
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}/${endpoint}" \
                > "cloudflare-audit/worker-details/${worker_name}-${endpoint}.json" \
                || printf '{"success":false,"result":null}' > "cloudflare-audit/worker-details/${worker_name}-${endpoint}.json"
            done
          done

          export D1_ACCESS="${d1_access}"
          export R2_ACCESS="${r2_access}"

          node <<'NODE'
          const fs = require("node:fs");
          const workersResponse = JSON.parse(fs.readFileSync("cloudflare-audit/workers-response.json", "utf8"));
          if (!workersResponse.success) throw new Error("Cloudflare Workers inventory request failed.");

          const read = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const workerDetails = {};
          for (const name of ["sunday-multiplied-website", "sunday-multiplied-preview", "sunday-multiplied-onboarding"]) {
            const settings = read(`cloudflare-audit/worker-details/${name}-settings.json`);
            const secrets = read(`cloudflare-audit/worker-details/${name}-secrets.json`);
            const deployments = read(`cloudflare-audit/worker-details/${name}-deployments.json`);
            const bindings = Array.isArray(settings.result?.bindings) ? settings.result.bindings : [];
            const secretList = Array.isArray(secrets.result) ? secrets.result : [];
            const deploymentList = Array.isArray(deployments.result?.deployments)
              ? deployments.result.deployments
              : Array.isArray(deployments.result) ? deployments.result : [];
            workerDetails[name] = {
              settingsAccessible: settings.success === true,
              bindings: bindings.map((item) => ({ name: item.name, type: item.type })),
              secretsAccessible: secrets.success === true,
              secretNames: secretList.map((item) => item.name),
              latestDeployment: deploymentList[0]
                ? {
                    id: deploymentList[0].id,
                    createdOn: deploymentList[0].created_on,
                    source: deploymentList[0].source,
                    strategy: deploymentList[0].strategy,
                  }
                : null,
            };
          }

          const domainsResponse = read("cloudflare-audit/domains-response.json");

          const result = {
            generatedAt: new Date().toISOString(),
            workers: (workersResponse.result || []).map((item) => ({
              name: item.id || item.name,
              createdOn: item.created_on || null,
              modifiedOn: item.modified_on || null,
              environment: item.default_environment?.environment || null,
            })),
            workerDetails,
            domains: (domainsResponse.result || []).map((item) => ({
              hostname: item.hostname,
              service: item.service,
              environment: item.environment,
              zoneId: item.zone_id,
            })),
            knownD1: {
              name: "sunday-multiplied-approvals",
              uuid: "10522aad-f31e-4fb2-a848-a2563f015171",
              accessibleWithDeploymentToken: process.env.D1_ACCESS === "true",
            },
            r2: process.env.R2_ACCESS === "true"
              ? JSON.parse(fs.readFileSync("cloudflare-audit/r2.json", "utf8")).map((item) => ({
                  name: item.name,
                  creationDate: item.creation_date,
                  location: item.location,
                  storageClass: item.storage_class,
                }))
              : [],
            inventoryPermissions: {
              d1: process.env.D1_ACCESS === "true",
              r2: process.env.R2_ACCESS === "true",
            },
            githubSecrets: {
              CLOUDFLARE_API_TOKEN: Boolean(process.env.CLOUDFLARE_API_TOKEN),
              CLOUDFLARE_ACCOUNT_ID: Boolean(process.env.CLOUDFLARE_ACCOUNT_ID),
              OPENAI_API_KEY: process.env.HAS_OPENAI_API_KEY === "true",
              BREVO_API_KEY: process.env.HAS_BREVO_API_KEY === "true",
              APPROVAL_ADMIN_EMAIL: process.env.HAS_APPROVAL_ADMIN_EMAIL === "true",
              APPROVAL_NOTIFICATION_EMAIL: process.env.HAS_APPROVAL_NOTIFICATION_EMAIL === "true",
            },
          };
          fs.writeFileSync("cloudflare-audit/inventory.json", JSON.stringify(result, null, 2));
          fs.rmSync("cloudflare-audit/workers-response.json");
          fs.rmSync("cloudflare-audit/domains-response.json");
          fs.rmSync("cloudflare-audit/worker-details", { recursive: true });
          for (const path of ["cloudflare-audit/d1.json", "cloudflare-audit/d1-error.txt", "cloudflare-audit/r2.json", "cloudflare-audit/r2-error.txt"]) {
            if (fs.existsSync(path)) fs.rmSync(path);
          }
          NODE

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-audit
          path: cloudflare-audit/inventory.json
          retention-days: 1

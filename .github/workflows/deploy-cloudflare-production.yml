name: Deploy Sunday Multiplied production

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-cloudflare-production.yml"

permissions:
  contents: read

concurrency:
  group: sunday-multiplied-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_WORKER: ${{ github.event_name == 'pull_request' && 'sunday-multiplied-preview' || 'sunday-multiplied-website' }}
      SMOKE_ORIGIN: ${{ github.event_name == 'pull_request' && 'https://preview.sundaymultiplied.com' || 'https://sundaymultiplied.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sermon analysis schema
        run: npm run test:sermon-schema

      - name: Validate teaching-source extraction
        run: npm run test:teaching-sources

      - name: Build and test rendered output
        run: npm test

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json --name "${TARGET_WORKER}" --keep-vars

      - name: Smoke test deployed Worker
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "${SMOKE_ORIGIN}/" > /dev/null

name: Sync merged church onboarding to CRM

on:
  pull_request:
    types: [closed]
    paths:
      - "churches/**/church.json"

permissions:
  contents: read

jobs:
  sync:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'onboard/')
    runs-on: ubuntu-latest
    steps:
      - name: Mark church active in CRM
        env:
          CRM_WEBHOOK_URL: ${{ secrets.CRM_WEBHOOK_URL }}
          CRM_WEBHOOK_SECRET: ${{ secrets.CRM_WEBHOOK_SECRET }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$CRM_WEBHOOK_URL" ] || [ -z "$CRM_WEBHOOK_SECRET" ]; then
            echo "CRM webhook secrets are not configured."
            exit 1
          fi

          CHURCH_NAME="${PR_TITLE#Onboard }"
          CHURCH_SLUG="${BRANCH_NAME#onboard/}"
          CHURCH_SLUG="${CHURCH_SLUG%-*}"

          PAYLOAD="$(jq -n \
            --arg secret "$CRM_WEBHOOK_SECRET" \
            --arg name "$CHURCH_NAME" \
            --arg slug "$CHURCH_SLUG" \
            --arg stage "Active" \
            --arg workspace "https://github.com/$REPOSITORY/tree/main/churches/$CHURCH_SLUG" \
            --arg draft "$PR_URL" \
            '{secret:$secret,event:"church_onboarding",church:{name:$name,website:"",slug:$slug},fields:{stage:$stage,repositoryWorkspace:$workspace,onboardingDraftUrl:$draft}}')"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            --data-binary "$PAYLOAD" \
            "$CRM_WEBHOOK_URL")"
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '(.status // 200) < 400 and (.ok == true)' >/dev/null
